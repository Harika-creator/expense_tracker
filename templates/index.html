<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <div class="d-flex justify-content-between">

            <h1>Expense Tracker</h1>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

        <form action="/add" method="POST" class="mt-4">

            <div class="row">

                <div class="col-md-3">
                    <input type="number"
                           step="0.01"
                           name="amount"
                           class="form-control"
                           placeholder="Amount"
                           required>
                </div>

                <div class="col-md-3">
                    <input type="text"
                           name="category"
                           class="form-control"
                           placeholder="Category"
                           required>
                </div>

                <div class="col-md-4">
                    <input type="text"
                           name="description"
                           class="form-control"
                           placeholder="Description"
                           required>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">
                        Add
                    </button>
                </div>

            </div>

        </form>

        <h3 class="mt-4 text-success">
            Total: ₹{{ total }}
        </h3>

        <table class="table table-striped mt-4">

            <thead class="table-dark">

                <tr>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody>

            {% for expense in expenses %}

                <tr>

                    <td>₹{{ expense[1] }}</td>

                    <td>{{ expense[2] }}</td>

                    <td>{{ expense[3] }}</td>

                    <td>
                        <a href="/delete/{{ expense[0] }}"
                           class="btn btn-danger btn-sm">
                           Delete
                        </a>
                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
